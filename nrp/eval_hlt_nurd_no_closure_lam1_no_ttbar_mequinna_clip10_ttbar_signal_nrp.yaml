apiVersion: batch/v1
kind: Job
metadata:
  name: eval-hlt-nurd-no-closure-no-ttbar-mequinna-clip10-ttbar-sig
  namespace: axol1tl
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
      containers:
        - name: eval
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="
              python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              pip install --quiet -r /axovol/contrastive_axis/hlt_nurd_con/nrp/requirements_nrp.txt
              pip install --quiet matplotlib scipy

              cd /axovol/contrastive_axis/hlt_nurd_con

              # Extract TTBar (label 2) from mequinna test set to use as signal
              echo "=== Extracting TTBar events from test set ==="
              python -c "
import torch
data = torch.load('/axovol/contrastive_axis/data/hlt_smcocktail_mequinna_test.pt', map_location='cpu')
mask = data['label'] == 2
ttbar = {k: v[mask] for k, v in data.items()}
torch.save(ttbar, '/tmp/hlt_ttbar_signal.pt')
print(f'Extracted {int(mask.sum())} TTBar events')
"

              # Best checkpoint: best val loss 0.04911 (gen_weight_clip=10, no TTBar)
              CKPT=checkpoints/hlt/hlt/hlt_nurd_no_closure_lam1_no_ttbar_mequinna_clip10/checkpoint_main_20260802_053841.pth.tar
              AE_CKPT=checkpoints/hlt/hlt/ae_pretrain/checkpoint_ae.pth
              OUTDIR=/axovol/contrastive_axis/hlt_nurd_con/eval_outputs/hlt_nurd_no_closure_lam1_no_ttbar_mequinna_clip10_ttbar_signal
              mkdir -p "$OUTDIR"

              echo "=== Running ABCD eval with TTBar as signal on: $CKPT ==="
              python eval_abcd_nurd.py \
                --ckpt             "$CKPT" \
                --ae_ckpt          "$AE_CKPT" \
                --test_pt          /axovol/contrastive_axis/data/hlt_smcocktail_mequinna_test.pt \
                --gen_weight_path  /axovol/contrastive_axis/data/weight_test.pt \
                --signal_pt        /tmp/hlt_ttbar_signal.pt \
                --outdir           "$OUTDIR" \
                --wandb_run_name   nurd_no_closure_no_ttbar_mequinna_clip10_ttbar_signal_abcd \
                --n_pca            6 \
                --min_md

              echo "=== Eval finished: $(date) ==="
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: WANDB_API_KEY
          resources:
            requests:
              memory: "32Gi"
              cpu: "4"
              nvidia.com/a100: "1"
            limits:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: axovol
              mountPath: /axovol
      volumes:
        - name: axovol
          persistentVolumeClaim:
            claimName: axovol
