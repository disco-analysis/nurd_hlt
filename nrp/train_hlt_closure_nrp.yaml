apiVersion: batch/v1
kind: Job
metadata:
  name: train-hlt-nurd-closure
  namespace: axol1tl
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
      containers:
        - name: train
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="
              python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              pip install --quiet -r /axovol/contrastive_axis/hlt_nurd_con/nrp/requirements_nrp.txt

              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

              cd /axovol/contrastive_axis/hlt_nurd_con

              DATA=/axovol/contrastive_axis/data/hlt_smcocktail_train.pt
              AE_CKPT=checkpoints/hlt/hlt/ae_pretrain/checkpoint_ae.pth

              echo "=== Step 1: AE pretraining: $(date) ==="
              python train_ae.py \
                --data         $DATA \
                --epochs       100 \
                --batch_size   4096 \
                --lr           1e-3 \
                --latent_dim   16 \
                --enc_nodes    512 256 \
                --dec_nodes    256 512 \
                --exp_name     ae_pretrain \
                --project_name hlt
              echo "=== AE pretraining done: $(date) ==="

              echo "=== Step 2: NURD closure training: $(date) ==="
              python train_hlt.py \
                --data         $DATA \
                --ae_ckpt      $AE_CKPT \
                --epochs       100 \
                --batch_size   4096 \
                --lr           1e-4 \
                --weight_decay 5e-3 \
                --n_bins       10 \
                --reweight     1 \
                --joint_indep  1 \
                --contrast_weight 0.2 \
                --contrast_temp   0.05 \
                --embed_size   128 \
                --latent_dim   6 \
                --proj_dim     6 \
                --num_heads    8 \
                --num_layers   4 \
                --dim_ff       512 \
                --linear_dim   16 \
                --critic_schedule          warmup \
                --critic_warmup_epochs     20 \
                --critic_ramp_epochs       10 \
                --critic_train_frac        0.2 \
                --critic_lr_multiplier     10.0 \
                --n_critic_steps_per_batch 3 \
                --_lambda      0.01 \
                --no_mi_norm \
                --closure_weight 0.1 \
                --closure_n_cuts 50 \
                --qcd_label      1 \
                --exp_name     hlt_nurd_closure_bs4096 \
                --project_name hlt \
                --manualSeed   42

              echo "=== NURD closure training done: $(date) ==="
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: WANDB_API_KEY
          resources:
            requests:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/a100: "1"
            limits:
              memory: "128Gi"
              cpu: "16"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: axovol
              mountPath: /axovol
      volumes:
        - name: axovol
          persistentVolumeClaim:
            claimName: axovol
